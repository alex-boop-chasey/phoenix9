# Settings for the phoenix9 project (copy to /srv/projects/phoenix9/phoenix.toml).
preset = "quick"
profile = "platform"
merge = "ask"
max_tries = 3
on_failure = "pause"
services = ["github"]
safety_files = [
  # Firewall and container launch
  "image/init-firewall.sh",  # the firewall that seals step containers
  "image/hands-dns-conf.sh",  # DNS allowlist the firewall calls
  "image/entry.sh",  # container start-up; runs the firewall
  "image/Dockerfile",  # base step image
  "profiles/*/image/Dockerfile",  # profile step images
  "phoenix9/docker.py",  # builds the docker run command (mounts, no socket)
  # Diff rules and secret scan
  "phoenix9/git.py",  # allow/deny diff rules and safe git calls
  "phoenix9/checklock.py",  # fingerprints of locked checks
  "steps/diff-rules/run.py",  # enforces the diff denylist
  "steps/secret-scan/run.py",  # finds secrets in a diff
  # Secrets
  "phoenix9/scrub.py",  # removes secret values from output
  "phoenix9/keys.py",  # stores and reads keys
  # Key proxy
  "phoenix9/proxy.py",  # the key proxy and its allowed calls
  "phoenix9/stepproxy.py",  # starts proxies around a step
  "phoenix9/adapters.py",  # Proxy adapter and Claude.launch container env
  "phoenix9/runner.py",  # starts proxies around each step
  "phoenix9/stepctx.py",  # what a step is handed
  # Updater
  "phoenix9/updater.py",  # installs and rolls back updates
  "phoenix9/hold.py",  # holds runs during an update
  "deploy/update.sh",  # the root update script
  "deploy/phoenix9-update.service",  # runs the updater as root
  "deploy/install.sh",  # first install
  "deploy/phoenix-api.service",  # dashboard service unit
  "deploy/phoenix-runner.service",  # runner service unit
  # Chat link
  "phoenix9/chatlink.py",  # the only code that writes to a chat session's socket
  # Deleting a project
  "phoenix9/project_delete.py",  # the delete-project plan and safety copy
  # Repairs
  "phoenix9/repair/*.py",  # repairs can change run state and unlock checks
  # No Claude on the host; planning sessions and quick edits
  "docs/architecture.md",  # the safety rules (section 11: Claude only in step containers)
  "phoenix9/chat.py",  # project chat units; never starts Claude
  "phoenix9/plans.py",  # planning-session records and queue
  "phoenix9/plansession.py",  # runs planning sessions in sealed step containers
  "phoenix9/claude.py",  # the only claude command line (for containers)
  "steps/_plan-session/*",  # the planning session's tools and prompt
  "phoenix9/edits.py",  # quick-edit branch copies
  "phoenix9/editfinish.py",  # quick-edit checks before a merge request
  "tests/test_no_host_claude.py",  # fails on any claude command run outside a container
  # Projects, removal and the runner loop
  "phoenix9/project_removal.py",  # what can never be removed or deleted
  "phoenix9/watch.py",  # the runner loop: runs, plans, chats
  "phoenix9/__main__.py",  # the command line entry point
  "phoenix9/cli/project.py",  # project commands incl. delete
  "phoenix9/ops/projects.py",  # project ops and the agent folder name
  "phoenix9/pause.py",  # Claude session ids that may be resumed
  "phoenix9/spec.py",  # the spec format every build and plan is checked against
  "phoenix9/atomic.py",  # safe file writes
  "deploy/claude-rc-chat@.service",  # the project chat unit
  "deploy/self-project.toml",  # this list itself
  # The checks themselves
  "check.sh",  # the check command
  "check-browser.sh",  # the browser check command
]

[deploy]
with = "none"
mode = "off"
