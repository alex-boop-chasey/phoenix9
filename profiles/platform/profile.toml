title = "Platform"
image = "phoenix9-step-platform:1"
allowed_domains = ["registry.npmjs.org", "pypi.org", "files.pythonhosted.org"]
diff_allow_extra = ["pnpm-lock.yaml"]
screenshots = false
suggested_deployer = "none"

[test]
cmd = "./check.sh"
task_cmd = "./check.sh"
report = "exit-code"
checks_dir = "tests/phoenix"
check_files = "*.sh"
check_command = "sh {files}"
affected_cmd = "python3 -m pytest -q {files}"
test_globs = "tests/test_*.py"
affected_all_globs = "check.sh conftest.py pytest.ini pyproject.toml requirements*.txt tests/conftest.py"
