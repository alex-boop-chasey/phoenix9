title = "Python script"
image = "phoenix9-step-python:1"
allowed_domains = ["pypi.org", "files.pythonhosted.org"]
diff_allow_extra = []
screenshots = false
suggested_deployer = "none"

[test]
cmd = "python3 -m pytest -q"
task_cmd = "python3 -m pytest -q"
report = "pytest-junit"
report_path = "test-report.xml"
checks_dir = "tests/phoenix"
check_files = "test_*.py"
check_command = "python3 -m pytest -q {files}"
report_args = "--junitxml=/out/pytest.xml"
affected_cmd = "python3 -m pytest -q {files}"
test_globs = "test_*.py *_test.py"
affected_all_globs = "conftest.py pytest.ini pyproject.toml setup.cfg tox.ini requirements*.txt poetry.lock uv.lock"
