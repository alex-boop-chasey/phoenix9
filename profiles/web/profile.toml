title = "Web app"
image = "phoenix9-step-web:1"
allowed_domains = ["registry.npmjs.org", "registry.yarnpkg.com"]
diff_allow_extra = ["pnpm-lock.yaml"]
screenshots = true
suggested_deployer = "vps-docker"

[test]
cmd = "pnpm exec vitest run --passWithNoTests"
task_cmd = "pnpm exec vitest run --passWithNoTests"
report = ["vitest-json"]
report_path = "test-report.json"
checks_dir = "tests/phoenix"
check_files = "*.test.ts *.test.tsx"
check_command = "pnpm exec vitest run --passWithNoTests {files}"
report_args = "--reporter=json --outputFile=/out/vitest.json"
affected_cmd = "pnpm exec vitest related --run --passWithNoTests {files}"
affected_takes = "sources"
test_globs = "*.test.ts *.test.tsx"
affected_all_globs = "package.json pnpm-lock.yaml vite.config.* vitest.config.* tsconfig*.json tailwind.config.*"
