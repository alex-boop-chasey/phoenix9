<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f3;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #656d76;
    --line: #e3e3de;
    --accent: #2f6f5e;
    --accent-text: #ffffff;
    --good: #2f6f5e;
    --bad: #b3261e;
    --bad-bg: #fbeceb;
    --focus: #4a90d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b;
      --card: #1e2125;
      --text: #e6e6e3;
      --muted: #9aa0a6;
      --line: #2e3237;
      --accent: #5fb39b;
      --accent-text: #0f1a17;
      --good: #6cc4aa;
      --bad: #f2a29c;
      --bad-bg: #3a2120;
      --focus: #7fb2ea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 16px; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 10px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .banner {
    display: none;
    background: var(--bad-bg);
    color: var(--bad);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .banner.show { display: block; }

  /* New project form */
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 180px; min-width: 0; }
  .field label { font-size: 0.85rem; color: var(--muted); }
  input[type=text] {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    width: 100%;
  }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 6px;
    padding: 9px 18px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .form-msg { margin: 10px 0 0; white-space: pre-line; }
  .form-msg:empty { display: none; }

  /* Project table: scrolls inside its card on narrow screens */
  .table-wrap { overflow-x: auto; margin: -4px -16px; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; min-width: 440px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:last-child td { border-bottom: 0; }
  .name { font-weight: 600; }
  .muted { color: var(--muted); }
  .ok { color: var(--good); }
  .err { color: var(--bad); }
  .off { color: var(--bad); }
  a.vscode { color: var(--accent); text-decoration: none; font-weight: 500; white-space: nowrap; }
  a.vscode:hover { text-decoration: underline; }

  footer { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Projects</h1>
  <div class="banner" id="banner" role="alert"></div>

  <section class="card">
    <h2>New project</h2>
    <form id="new-form" novalidate>
      <div class="field">
        <label for="new-name">Name (lowercase letters, digits, dashes)</label>
        <input type="text" id="new-name" autocomplete="off" autocapitalize="off" spellcheck="false"
               maxlength="41" placeholder="my-project" required>
      </div>
      <div class="field">
        <label for="new-repo">Copy from GitHub repo (optional, owner/name)</label>
        <input type="text" id="new-repo" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="rebirth-wd/site-name">
      </div>
      <button type="submit" id="new-button">Create</button>
    </form>
    <p class="form-msg" id="new-msg" aria-live="polite"></p>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Project</th><th>Files</th><th>Status</th><th>Last used</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
  <footer>Every project is always on. Chats happen in the Claude desktop app: pick the project, start a chat.</footer>
</main>

<script>
  // All URLs are relative: the page is served under /proxy/8090/.
  const VSCODE = "https://files.rebirthwebdesign.com.au/?folder=/srv/projects/";
  const NAME_RE = /^[a-z0-9][a-z0-9-]{0,40}$/;
  const REPO_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;

  let data = null;            // last good project list

  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    for (const c of children) node.append(c);
    return node;
  }

  function statusText(p) {
    if (p.state !== "on") return "off (ask the home chat to switch it on)";
    if (p.chats > 0) return "on · " + (p.chats === 1 ? "1 chat open" : p.chats + " chats open");
    return "on";
  }

  function showBanner(text) {
    $("banner").textContent = text;
    $("banner").classList.toggle("show", Boolean(text));
  }

  // Every action is a POST with the custom header the server insists on.
  async function post(path, body) {
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Selector": "1" },
        body: JSON.stringify(body),
      });
      const reply = await res.json().catch(() => null);
      if (reply && typeof reply.message === "string") return reply;
      return { ok: false, message: "The server sent an unexpected reply (" + res.status + ")." };
    } catch (e) {
      return { ok: false, message: "Couldn't reach the server." };
    }
  }

  async function refresh() {
    try {
      const res = await fetch("api/projects", { cache: "no-store" });
      const reply = await res.json().catch(() => null);
      if (!res.ok || !reply || !Array.isArray(reply.projects)) {
        const why = reply && reply.message ? reply.message : "status " + res.status;
        showBanner("Couldn't load the project list: " + why + ". Showing the last one.");
        return;
      }
      data = reply;
      showBanner("");
      render();
    } catch (e) {
      showBanner("Couldn't reach the server. Showing the last project list.");
    }
  }

  function render() {
    const rows = [];
    for (const p of data.projects) {
      const link = el("a", {
        className: "vscode",
        href: VSCODE + encodeURIComponent(p.name),
        target: "_blank",
        rel: "noopener",
        title: "Open this project's files in VS Code",
        textContent: "Open in VS Code",
      });
      rows.push(el("tr", {}, [
        el("td", { className: "name", textContent: p.name }),
        el("td", {}, [link]),
        el("td", { className: p.state === "on" ? "" : "off", textContent: statusText(p) }),
        el("td", { className: "muted", textContent: p.last_used }),
      ]));
    }
    if (!rows.length) rows.push(el("tr", {}, [el("td", { colSpan: 4, className: "muted", textContent: "No projects yet." })]));
    $("rows").replaceChildren(...rows);
  }

  $("new-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const name = $("new-name").value.trim();
    const repo = $("new-repo").value.trim();
    const msg = $("new-msg");
    msg.className = "form-msg err";
    if (!NAME_RE.test(name)) {
      msg.textContent = "Use lowercase letters, digits and dashes for the name (start with a letter or digit).";
      return;
    }
    if (repo && !REPO_RE.test(repo)) {
      msg.textContent = "The GitHub repo should look like owner/name.";
      return;
    }
    const button = $("new-button");
    button.disabled = true;
    button.textContent = "Creating…";
    msg.className = "form-msg muted";
    msg.textContent = repo ? "Copying " + repo + ", this can take a minute…" : "Working…";
    const result = await post("api/new", repo ? { name, repo } : { name });
    button.disabled = false;
    button.textContent = "Create";
    msg.className = "form-msg " + (result.ok ? "ok" : "err");
    msg.textContent = result.message +
      (result.ok ? "\nNext: start a chat in it from the Claude app so Claude can fill in what the project is (its CLAUDE.md)." : "");
    if (result.ok) {
      $("new-name").value = "";
      $("new-repo").value = "";
    }
    refresh();
  });

  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 10000);
</script>
</body>
</html>
