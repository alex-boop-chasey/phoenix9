# Phoenix v8 core as a Docker Compose project (Hostinger Docker Manager).
# Set up with deploy/install.sh. Start:  docker compose -f deploy/docker-compose.yml up -d
name: phoenix-v8

services:
  phoenix:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.phoenix
    image: phoenix-core:8
    container_name: phoenix
    command: python -m phoenix watch
    restart: unless-stopped
    mem_limit: 1g
    environment:
      PHOENIX_HOME: /phoenix
      # Phoenix starts step containers through the host's Docker, which needs
      # host paths. Phoenix looks these volumes up once at start (docker volume inspect).
      PHOENIX_VOLUMES: plans=phoenix-plans,runs=phoenix-runs,config=phoenix-config,cache=phoenix-cache
    volumes:
      # Docker control. Only this container has it; step containers never do.
      - /var/run/docker.sock:/var/run/docker.sock
      - phoenix-plans:/phoenix/plans
      - phoenix-runs:/phoenix/runs
      - phoenix-config:/phoenix/config
      - phoenix-cache:/phoenix/cache
      # Telegram: the host's ph-notify writes this one file and phoenix-notify.path
      # sends it. install.sh sets PHOENIX_NOTIFY_FILE in deploy/.env; without it
      # the messages go to /dev/null.
      - type: bind
        source: ${PHOENIX_NOTIFY_FILE:-/dev/null}
        target: /srv/phoenix-inbox/jobs/notify.msg
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  phoenix-plans:
    name: phoenix-plans
    external: true
  phoenix-runs:
    name: phoenix-runs
    external: true
  phoenix-config:
    name: phoenix-config
    external: true
  phoenix-cache:
    name: phoenix-cache
    external: true
