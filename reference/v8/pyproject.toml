[project]
name = "phoenix"
version = "8.0.0"
description = "Phoenix v8 core: builds websites from hand-written plan.md files."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
phoenix = "phoenix.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phoenix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
