name = "openrouter"
title = "OpenRouter"
description = "One API for many AI models."
support = "store-and-wire"
docs = "https://openrouter.ai/docs"
account_keys = ["OPENROUTER_API_KEY"]
hosts = ["openrouter.ai"]

[[project_keys]]
name = "OPENROUTER_API_KEY"
secret = true
public = false
required = true
help = "openrouter.ai > Settings > Keys: make one key per site and set a credit limit."

[[project_keys]]
name = "OPENROUTER_SITE_URL"
secret = false
public = false
required = false
help = "The site's address; sent to OpenRouter as the HTTP-Referer for attribution."

[[project_keys]]
name = "OPENROUTER_SITE_NAME"
secret = false
public = false
required = false
help = "The site's name; sent to OpenRouter for attribution."


[proxy]
upstream = "https://openrouter.ai/api/v1"
auth_header = "Authorization"
auth_format = "Bearer {key}"
key = "OPENROUTER_API_KEY"
extra_headers = {}

# Starting list from the service's public API docs; checked on first real use.
[[proxy.allow]]
method = "GET"
path = "/key"
[[proxy.allow]]
method = "GET"
path = "/models"

[check]
method = "GET"
path = "/key"
expect = [200]
