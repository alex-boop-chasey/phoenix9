name = "resend"
title = "Resend"
description = "Sending email from your app."
support = "store-and-wire"
docs = "https://resend.com/docs"
account_keys = ["RESEND_API_KEY"]
hosts = ["api.resend.com"]

[[project_keys]]
name = "RESEND_API_KEY"
secret = true
public = false
required = true
help = "Resend > API Keys > Create: pick Sending access and limit it to this site's domain."

[[project_keys]]
name = "RESEND_FROM"
secret = false
public = false
required = true
help = "An address on a domain verified at Resend > Domains. onboarding@resend.dev is for tests only."

[[project_keys]]
name = "RESEND_WEBHOOK_SECRET"
secret = true
public = false
required = false
help = "Resend > Webhooks > the endpoint. Only if the site receives Resend webhooks."


[[account_settings]]
name = "send_from"
label = "Send from"
placeholder = "hello@yourdomain.com.au"
help = "The sender address new projects use for email."

[proxy]
upstream = "https://api.resend.com"
auth_header = "Authorization"
auth_format = "Bearer {key}"
key = "RESEND_API_KEY"
extra_headers = {}

# Starting list from the service's public API docs; checked on first real use.
[[proxy.allow]]
method = "GET"
path = "/domains"
[[proxy.allow]]
method = "GET"
path = "/domains/*"

[check]
method = "GET"
path = "/domains"
expect = [200]
