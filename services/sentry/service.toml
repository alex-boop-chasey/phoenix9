name = "sentry"
title = "Sentry"
description = "Error reporting and tracing."
support = "store-and-wire"
docs = "https://docs.sentry.io"
account_keys = ["SENTRY_AUTH_TOKEN"]
# sentry.io is not opened to step containers: its ingest subdomains are an exfiltration route (V8 firewall note).
hosts = []

[[project_keys]]
name = "PUBLIC_SENTRY_DSN"
secret = false
public = true
required = true
help = "Project Settings > Client Keys (DSN). Safe in the browser: it only lets events in."

[[project_keys]]
name = "SENTRY_ORG"
secret = false
public = false
required = false
help = "Your organisation slug (in the Sentry address). Only for uploading source maps."

[[project_keys]]
name = "SENTRY_PROJECT"
secret = false
public = false
required = false
help = "Project Settings > General: the project slug. Only for uploading source maps."

[[project_keys]]
name = "SENTRY_AUTH_TOKEN"
secret = true
public = false
required = false
help = "Settings > Auth Tokens: a narrow organisation token with release and source map rights. Only for source map upload at build time."


[[account_settings]]
name = "organisation"
label = "Organisation slug"
placeholder = "my-organisation"

[[account_settings]]
name = "default_team"
label = "Default team"
placeholder = "my-team"
help = "The team slug new Sentry projects are created under."

[proxy]
upstream = "https://sentry.io/api/0"
auth_header = "Authorization"
auth_format = "Bearer {key}"
key = "SENTRY_AUTH_TOKEN"
extra_headers = {}

# Starting list from the service's public API docs; checked on first real use.
# Sentry needs the trailing slash: GET /organizations answers 404, /organizations/ answers properly.
[[proxy.allow]]
method = "GET"
path = "/organizations/"
[[proxy.allow]]
method = "GET"
path = "/organizations/*/projects/"
[[proxy.allow]]
method = "POST"
path = "/teams/*/*/projects/"
[[proxy.allow]]
method = "GET"
path = "/projects/*/*/keys/"

[check]
method = "GET"
path = "/organizations/"
expect = [200]
