name = "sentry"
title = "Sentry"
description = "Error reporting and tracing."
support = "store-and-wire"
docs = "https://docs.sentry.io"
account_keys = ["SENTRY_AUTH_TOKEN"]
# sentry.io is not opened to step containers: its ingest subdomains are an exfiltration route (V8 firewall note).
hosts = []

[[project_keys]]
name = "SENTRY_DSN"
secret = false

[[project_keys]]
name = "SENTRY_ORG"
secret = false

[[project_keys]]
name = "SENTRY_PROJECT"
secret = false

[proxy]
upstream = "https://sentry.io/api/0"
auth_header = "Authorization"
auth_format = "Bearer {key}"
key = "SENTRY_AUTH_TOKEN"
extra_headers = {}

# Starting list from the service's public API docs; checked on first real use.
[[proxy.allow]]
method = "GET"
path = "/organizations"
[[proxy.allow]]
method = "GET"
path = "/organizations/*/projects"

[check]
method = "GET"
path = "/organizations"
expect = [200]
