name = "check-writer"
title = "Check writer"
description = "Writes the task's checks before any code exists."
kind = "ai"
level = "task"
order = 10
needs = ["task", "worktree", "failures"]
produces = ["checks"]
default = "off"

[ai]
model = "claude-sonnet-5-5"
fallback_models = ["claude-opus-5-5"]
tools = ["Read", "Glob", "Grep", "Write", "Edit", "Bash"]   # it writes check scripts and runs them
tools_denied = ["WebFetch", "WebSearch"]
mcp_servers = []
claude_md = "library"
skills = []
max_turns = 40
timeout = 20

[ai.advisor]
on = false
model = "claude-opus-5-5"
when = ["blocked"]
instructions = ""

[settings]
once = true
