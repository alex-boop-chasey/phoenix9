name = "planner"
title = "Planner"
description = "Writes a short plan for the whole spec before building."
kind = "ai"
level = "run"
phase = "start"
order = 45
needs = ["spec"]
produces = ["plan"]
default = "off"

[settings]
auto_approve = false    # true = the plan question is approved automatically (only this question, never merge)

[ai]
model = "claude-sonnet-5-5"
fallback_models = ["claude-opus-5-5"]
tools = ["Read", "Glob", "Grep", "Write"]          # it only reads the project and writes /out/spec.md
tools_denied = ["Bash", "WebFetch", "WebSearch"]
mcp_servers = []
claude_md = "library"
skills = []
max_turns = 40
timeout = 20

[ai.advisor]
on = false
model = "claude-opus-5-5"
when = ["blocked"]
instructions = ""
