name = "reviewer"
title = "Reviewer"
description = "A fresh reader checks the change and gives a verdict."
kind = "ai"
level = "task"
order = 80
needs = ["worktree", "test-report"]
produces = ["verdict"]
default = "off"

[ai]
model = "claude-sonnet-5-5"
fallback_models = ["claude-opus-5-5"]
tools = ["Read", "Glob", "Grep", "Bash", "Write"]   # it reads and inspects; Write only for /out/verdict.json
tools_denied = ["Edit", "WebFetch", "WebSearch"]
mcp_servers = []
claude_md = "library"
skills = []
max_turns = 30
timeout = 15

[ai.advisor]
on = false
model = "claude-opus-5-5"
when = ["blocked"]
instructions = ""

[settings]
strict = true
